name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Determine public URL and base path
        env:
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
          CUSTOM_BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ -n "$CUSTOM_SITE_URL" ]; then
            echo "SITE_URL=$CUSTOM_SITE_URL" >> "$GITHUB_ENV"
            echo "BASE_PATH=${CUSTOM_BASE_PATH:-/}" >> "$GITHUB_ENV"
          elif [ "$repo" = "$owner.github.io" ]; then
            echo "SITE_URL=https://${owner}.github.io/" >> "$GITHUB_ENV"
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=https://${owner}.github.io/${repo}/" >> "$GITHUB_ENV"
            echo "BASE_PATH=/${repo}/" >> "$GITHUB_ENV"
          fi
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build and prerender
        run: npm run build
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
